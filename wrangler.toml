name = "sms-agent-router"
main = "src/index.js"
compatibility_date = "2026-06-18"

[observability]
enabled = true

# Non-secret settings. Secrets (TWILIO_AUTH_TOKEN, OWNER_NUMBERS, PIN, and each
# route's URL and key) go in with `npx wrangler secret put NAME`, never here.
[vars]
# ROUTES is JSON inside a TOML multi-line string ('''...'''): keep it valid
# JSON (double quotes, no trailing commas, no comments). Every url_env and
# key_env names a secret you must create with exactly that name.
ROUTES = '''
[
  { "name": "grok",   "prefix": "grok",   "url_env": "GROK_URL",   "auth": "standard-webhooks", "key_env": "GROK_SECRET" },
  { "name": "claude", "prefix": "claude", "url_env": "CLAUDE_URL", "auth": "bearer",            "key_env": "CLAUDE_KEY", "payload": "text" }
]
'''
# Optional: text back as soon as a text is routed (before the agent answers),
# e.g. "Routing to {agent}". Empty = silent. Each reply is a billed SMS.
ACK = ""
# REPLY_ON_NO_MATCH = "false"          # stay silent when no prefix matches
# PUBLIC_URL = "https://sms.example.com"  # only behind a custom domain or proxy

# Optional replay guard: drop a repeated MessageSid for 24 hours.
# Create it with `npx wrangler kv namespace create SEEN`, then uncomment
# and paste the id it prints.
# [[kv_namespaces]]
# binding = "SEEN"
# id = "<paste id>"
