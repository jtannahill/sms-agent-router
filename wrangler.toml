name = "sms-agent-router"
main = "src/index.js"
compatibility_date = "2026-06-18"

[observability]
enabled = true

# Non-secret settings. Secrets (TWILIO_AUTH_TOKEN, each route's key, OWNER_NUMBERS,
# PIN) go in with `wrangler secret put NAME`, never in this file.
[vars]
# Which agent each prefix reaches. url_env / key_env name the secrets that hold
# the endpoint and its credential. See README for the fields.
ROUTES = '''
[
  { "name": "grok",   "prefix": "grok",   "url_env": "GROK_URL",   "auth": "standard-webhooks", "key_env": "GROK_SECRET" },
  { "name": "claude", "prefix": "claude", "url_env": "CLAUDE_URL", "auth": "bearer",            "key_env": "CLAUDE_KEY", "payload": "text" }
]
'''
# Optional: reply to every routed text, e.g. "Sent to {agent}". Empty = silent.
ACK = ""
